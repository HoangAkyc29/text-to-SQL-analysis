[project]
name = "data-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["platform-core", "project-core", "fastapi", "uvicorn[standard]", "openai>=1.0", "httpx>=0.27", "pandas>=2.0", "pyarrow>=14", "redis>=5.0", "pymongo>=4.6"]

[project.scripts]
data-agent = "data_agent.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_agent"]

[tool.hatch.metadata]
allow-direct-references = true
