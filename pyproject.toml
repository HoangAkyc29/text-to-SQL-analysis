[project]
name = "multi-agent-monorepo"
version = "0.1.0"
description = "Base monorepo template for generic multi-agent projects (uv workspace)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "platform-core",
]

[tool.uv.workspace]
members = [
    "libs/*",
    "packages/*",
    "agents/chat-gateway",
    "agents/conversational-router",
    "agents/data-agent",
    "agents/tool-selector",
    "mcp-servers/*",
]
# agents/archived/* intentionally excluded from the workspace

[tool.uv.sources]
commons = { workspace = true }
agent-core = { workspace = true }
mcp-core = { workspace = true }
platform-core = { workspace = true }
project-core = { workspace = true }
project-test = { workspace = true }
base-mcp-server = { workspace = true }
sql-gateway = { workspace = true }
python-sandbox = { workspace = true }
conversational-router = { workspace = true }
chat-gateway = { workspace = true }
tool-selector = { workspace = true }
data-agent = { workspace = true }
product-lookup = { workspace = true }
data-query = { workspace = true }
dataframe-ops = { workspace = true }
deliverables = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "project-test",
    "chat-gateway",
    "sql-gateway",
    "conversational-router",
    "tool-selector",
    "data-agent",
]
# Docker base image tiers — see docs/DOCKER_BUILD.md
# TODO: add domain packages to docker-project when the project needs heavier shared deps
docker-project = ["project-core"]
# TODO: add mcp-core transitive deps if MCP servers need extra libraries
docker-mcp = ["project-core", "mcp-core"]
# TODO: extend with openai/strands/... per agent project
docker-agent = [
    "project-core",
    "platform-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openai>=1.0",
    "redis>=5.0",
    "pymongo>=4.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests", "packages/project-test"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "live: opt-in tests requiring real SQL or LLM (OPENROUTER_API_KEY, ANALYTICS_DB_DSN)",
]
