# Docker image manifest — maps services to base tiers and uv packages.
# See docs/DOCKER_BUILD.md when adding a new image.
# Image prefix: abstract-base/

bases:
  project:
    image: abstract-base/project-base:local
    dockerfile: docker/base/Dockerfile.project
    group: docker-project
  mcp:
    image: abstract-base/mcp-base:local
    dockerfile: docker/base/Dockerfile.mcp
    group: docker-mcp
    from: project
  agent:
    image: abstract-base/agent-base:local
    dockerfile: docker/base/Dockerfile.agent
    group: docker-agent
    from: project

services:
  base-mcp-server:
    base: mcp
    package: base-mcp-server
    dockerfile: mcp-servers/base-mcp-server/Dockerfile
    port: 8100
  sql-gateway:
    base: mcp
    package: sql-gateway
    dockerfile: mcp-servers/sql-gateway/Dockerfile
    port: 18101
  product-lookup:
    base: mcp
    package: product-lookup
    compose_profile: mcp-stdio
  data-query:
    base: mcp
    package: data-query
    compose_profile: mcp-stdio
  dataframe-ops:
    base: mcp
    package: dataframe-ops
    compose_profile: mcp-stdio
  deliverables:
    base: mcp
    package: deliverables
    compose_profile: mcp-stdio
  conversational-router:
    base: agent
    package: conversational-router
    dockerfile: agents/conversational-router/Dockerfile
    port: 18201
  tool-selector:
    base: agent
    package: tool-selector
    dockerfile: agents/tool-selector/Dockerfile
    port: 18205
  data-agent:
    base: agent
    package: data-agent
    dockerfile: agents/data-agent/Dockerfile
    port: 18206
  chat-gateway:
    base: agent
    package: chat-gateway
    dockerfile: agents/chat-gateway/Dockerfile
    port: 18300
  # Archived classic agents — optional profile only
  sql-planner:
    base: agent
    package: sql-planner
    dockerfile: agents/archived/sql-planner/Dockerfile
    port: 18202
    compose_profile: classic-agents
  risk-reviewer:
    base: agent
    package: risk-reviewer
    dockerfile: agents/archived/risk-reviewer/Dockerfile
    port: 18203
    compose_profile: classic-agents
  data-analyst:
    base: agent
    package: data-analyst
    dockerfile: agents/archived/data-analyst/Dockerfile
    port: 18204
    compose_profile: classic-agents
