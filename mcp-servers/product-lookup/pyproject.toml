[project]
name = "product-lookup"
version = "0.1.0"
description = "Product / SKU lookup MCP"
requires-python = ">=3.11"
dependencies = [
    "mcp-core",
    "project-core",
    "pandas>=2.0",
    "pyarrow>=14",
    "httpx>=0.27",
]

[project.scripts]
product-lookup = "product_lookup.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/product_lookup"]

[tool.hatch.metadata]
allow-direct-references = true
