[project]
name = "data-query"
version = "0.1.0"
description = "Flexible parameterized SQL query MCP"
requires-python = ">=3.11"
dependencies = [
    "mcp-core",
    "project-core",
    "pandas>=2.0",
    "pyarrow>=14",
    "httpx>=0.27",
]

[project.scripts]
data-query = "data_query.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_query"]

[tool.hatch.metadata]
allow-direct-references = true
