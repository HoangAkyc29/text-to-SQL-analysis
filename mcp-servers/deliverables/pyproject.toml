[project]
name = "deliverables"
version = "0.1.0"
description = "Export / chart deliverables MCP"
requires-python = ">=3.11"
dependencies = [
    "mcp-core",
    "project-core",
    "pandas>=2.0",
    "pyarrow>=14",
]

[project.scripts]
deliverables = "deliverables.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deliverables"]

[tool.hatch.metadata]
allow-direct-references = true
