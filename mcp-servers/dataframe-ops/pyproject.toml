[project]
name = "dataframe-ops"
version = "0.1.0"
description = "Working-set dataframe ops MCP"
requires-python = ">=3.11"
dependencies = [
    "mcp-core",
    "project-core",
    "pandas>=2.0",
    "pyarrow>=14",
]

[project.scripts]
dataframe-ops = "dataframe_ops.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataframe_ops"]

[tool.hatch.metadata]
allow-direct-references = true
