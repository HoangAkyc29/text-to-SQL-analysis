# Supermarket platform wiring — agents, MCP servers, memory
# Data Agent + Tool-Selector; tools via MCP stdio (except trivial native helpers).

memory:
  stm:
    backend: redis
    url_env: REDIS_URL
  ltm:
    backend: mongodb
    url_env: MONGODB_URI
    database: supermarket_agent
  checkpoint_db_path: ./data/checkpoints.db

mcp_servers:
  product-lookup:
    prefix: product
    transport: stdio
    command: uv
    args: ["run", "--directory", "mcp-servers/product-lookup", "product-lookup"]
  data-query:
    prefix: query
    transport: stdio
    command: uv
    args: ["run", "--directory", "mcp-servers/data-query", "data-query"]
  dataframe-ops:
    prefix: ops
    transport: stdio
    command: uv
    args: ["run", "--directory", "mcp-servers/dataframe-ops", "dataframe-ops"]
  deliverables:
    prefix: deliver
    transport: stdio
    command: uv
    args: ["run", "--directory", "mcp-servers/deliverables", "deliverables"]
  # Infrastructure only — agents must not list this in mcp_servers.
  sql-gateway:
    prefix: sql
    transport: sse
    url_env: SQL_GATEWAY_URL
    command: uv
    args: ["run", "sql-gateway"]

agents:
  conversational-router:
    capabilities: [router, ingress, synthesize, clarification_bridge]
    factory: conversational_router.service:build_service
    mcp_servers: []
    skill: router
    endpoint_env: AGENT_I_URL
  tool-selector:
    capabilities: [tool_select]
    factory: tool_selector.service:build_service
    mcp_servers: []
    skill: tool_selector
    endpoint_env: AGENT_TOOL_SELECTOR_URL
  data-agent:
    capabilities: [analytics, data_fetch]
    factory: data_agent.service:build_service
    mcp_servers: [product-lookup, data-query, dataframe-ops, deliverables]
    skill: data_agent
    endpoint_env: AGENT_DATA_URL

orchestration:
  type: pipeline
  entry: conversational-router
