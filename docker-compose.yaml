# Supermarket stack — build shared bases first:
#   docker compose --profile docker-bases build
#   docker compose build
# Or: .\scripts\docker-build.ps1 all
#
# Pull infra images:  docker compose pull redis mongodb
# Ports (host):        docs/PORTS.md

x-agent-build: &agent-build
  context: .
  args:
    BASE_IMAGE: abstract-base/agent-base:local

x-mcp-build: &mcp-build
  context: .
  args:
    BASE_IMAGE: abstract-base/mcp-base:local

services:
  project-base:
    profiles: [docker-bases]
    build:
      context: .
      dockerfile: docker/base/Dockerfile.project
    image: abstract-base/project-base:local

  mcp-base:
    profiles: [docker-bases]
    build:
      context: .
      dockerfile: docker/base/Dockerfile.mcp
      args:
        PROJECT_BASE: abstract-base/project-base:local
    image: abstract-base/mcp-base:local

  agent-base:
    profiles: [docker-bases]
    build:
      context: .
      dockerfile: docker/base/Dockerfile.agent
      args:
        PROJECT_BASE: abstract-base/project-base:local
    image: abstract-base/agent-base:local

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["18379:6379"]
    volumes: [supermarket-redis:/data]

  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports: ["18217:27017"]
    volumes: [supermarket-mongo:/data/db]

  sql-gateway:
    build:
      <<: *mcp-build
      dockerfile: mcp-servers/sql-gateway/Dockerfile
    env_file: .env
    restart: unless-stopped
    environment:
      - ANALYTICS_DB_DSN=${ANALYTICS_DB_DSN}
      - ANALYTICS_DB_DSN_2=${ANALYTICS_DB_DSN_2}
      - SQL_GATEWAY_HTTP_PORT=18101
    ports: ["18101:18101"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [redis, mongodb]

  conversational-router:
    build:
      <<: *agent-build
      dockerfile: agents/conversational-router/Dockerfile
    env_file: .env
    restart: unless-stopped
    environment:
      - AGENT_HTTP_PORT=18201
    ports: ["18201:18201"]

  sql-planner:
    build:
      <<: *agent-build
      dockerfile: agents/sql-planner/Dockerfile
    env_file: .env
    restart: unless-stopped
    environment:
      - AGENT_HTTP_PORT=18202
    ports: ["18202:18202"]

  risk-reviewer:
    build:
      <<: *agent-build
      dockerfile: agents/risk-reviewer/Dockerfile
    env_file: .env
    restart: unless-stopped
    environment:
      - AGENT_HTTP_PORT=18203
    ports: ["18203:18203"]

  data-analyst:
    build:
      <<: *agent-build
      dockerfile: agents/data-analyst/Dockerfile
    env_file: .env
    restart: unless-stopped
    environment:
      - AGENT_HTTP_PORT=18204
    ports: ["18204:18204"]
    # Shared with chat-gateway: pipeline (in chat-gateway) writes query parquet +
    # uploads here; Agent IV reads/writes analysis artifacts on the same paths.
    volumes:
      - supermarket-artifacts:/app/data/artifacts
      - supermarket-attachments:/app/data/attachments

  chat-gateway:
    build:
      <<: *agent-build
      dockerfile: agents/chat-gateway/Dockerfile
    env_file: .env
    restart: unless-stopped
    environment:
      - CHAT_GATEWAY_PORT=18300
      - REDIS_URL=redis://redis:6379/0
      - MONGODB_URI=mongodb://mongodb:27017/supermarket_agent
      - SQL_GATEWAY_URL=http://sql-gateway:18101
      - AGENT_I_URL=http://conversational-router:18201
      - AGENT_II_URL=http://sql-planner:18202
      - AGENT_III_URL=http://risk-reviewer:18203
      - AGENT_IV_URL=http://data-analyst:18204
    ports: ["18300:18300"]
    volumes:
      - supermarket-artifacts:/app/data/artifacts
      - supermarket-attachments:/app/data/attachments
      # Pipeline (runs here) writes the SQL audit trail to data/state/audit.jsonl.
      - supermarket-state:/app/data/state
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [redis, mongodb, sql-gateway, sql-planner, risk-reviewer, data-analyst, conversational-router]

volumes:
  supermarket-redis:
  supermarket-mongo:
  supermarket-artifacts:
  supermarket-attachments:
  supermarket-state:
