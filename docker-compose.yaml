# Supermarket stack — build shared bases first:
#   docker compose --profile docker-bases build
#   docker compose build
# Or: .\scripts\docker-build.ps1 all

x-agent-build: &agent-build
  context: .
  args:
    BASE_IMAGE: abstract-base/agent-base:local

x-mcp-build: &mcp-build
  context: .
  args:
    BASE_IMAGE: abstract-base/mcp-base:local

services:
  project-base:
    profiles: [docker-bases]
    build:
      context: .
      dockerfile: docker/base/Dockerfile.project
    image: abstract-base/project-base:local

  mcp-base:
    profiles: [docker-bases]
    build:
      context: .
      dockerfile: docker/base/Dockerfile.mcp
      args:
        PROJECT_BASE: abstract-base/project-base:local
    image: abstract-base/mcp-base:local

  agent-base:
    profiles: [docker-bases]
    build:
      context: .
      dockerfile: docker/base/Dockerfile.agent
      args:
        PROJECT_BASE: abstract-base/project-base:local
    image: abstract-base/agent-base:local

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  mongodb:
    image: mongo:7
    ports: ["27017:27017"]

  sql-gateway:
    build:
      <<: *mcp-build
      dockerfile: mcp-servers/sql-gateway/Dockerfile
    env_file: .env
    environment:
      - ANALYTICS_DB_DSN=${ANALYTICS_DB_DSN}
      - ANALYTICS_DB_DSN_2=${ANALYTICS_DB_DSN_2}
    ports: ["8101:8101"]

  conversational-router:
    build:
      <<: *agent-build
      dockerfile: agents/conversational-router/Dockerfile
    env_file: .env
    environment:
      - AGENT_HTTP_PORT=8201
    ports: ["8201:8201"]

  sql-planner:
    build:
      <<: *agent-build
      dockerfile: agents/sql-planner/Dockerfile
    env_file: .env
    environment:
      - AGENT_HTTP_PORT=8202
    ports: ["8202:8202"]

  risk-reviewer:
    build:
      <<: *agent-build
      dockerfile: agents/risk-reviewer/Dockerfile
    env_file: .env
    environment:
      - AGENT_HTTP_PORT=8203
    ports: ["8203:8203"]

  data-analyst:
    build:
      <<: *agent-build
      dockerfile: agents/data-analyst/Dockerfile
    env_file: .env
    environment:
      - AGENT_HTTP_PORT=8204
    ports: ["8204:8204"]

  chat-gateway:
    build:
      <<: *agent-build
      dockerfile: agents/chat-gateway/Dockerfile
    env_file: .env
    environment:
      - CHAT_GATEWAY_PORT=8300
      - REDIS_URL=redis://redis:6379/0
      - MONGODB_URI=mongodb://mongodb:27017/supermarket_agent
      - ALLOW_DEV_AUTH=1
      - SQL_GATEWAY_URL=http://sql-gateway:8101
      - AGENT_I_URL=http://conversational-router:8201
      - AGENT_II_URL=http://sql-planner:8202
      - AGENT_III_URL=http://risk-reviewer:8203
      - AGENT_IV_URL=http://data-analyst:8204
    ports: ["8300:8300"]
    depends_on: [redis, mongodb, sql-gateway, sql-planner, risk-reviewer, data-analyst, conversational-router]
