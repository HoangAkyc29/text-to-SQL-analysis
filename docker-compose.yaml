# Supermarket stack — build shared bases first:
#   docker compose --profile docker-bases build
#   docker compose build
# Or: .\scripts\docker-build.ps1 all
#
# Pull infra images:  docker compose pull redis mongodb
# Ports (host):        docs/PORTS.md

x-agent-build: &agent-build
  context: .
  args:
    BASE_IMAGE: abstract-base/agent-base:local

x-agent-env: &agent-env
  REDIS_URL: redis://redis:6379/0
  MONGODB_URI: mongodb://mongodb:27017/supermarket_agent

x-mcp-build: &mcp-build
  context: .
  args:
    BASE_IMAGE: abstract-base/mcp-base:local

services:
  project-base:
    profiles: [docker-bases]
    build:
      context: .
      dockerfile: docker/base/Dockerfile.project
    image: abstract-base/project-base:local

  mcp-base:
    profiles: [docker-bases]
    build:
      context: .
      dockerfile: docker/base/Dockerfile.mcp
      args:
        PROJECT_BASE: abstract-base/project-base:local
    image: abstract-base/mcp-base:local

  agent-base:
    profiles: [docker-bases]
    build:
      context: .
      dockerfile: docker/base/Dockerfile.agent
      args:
        PROJECT_BASE: abstract-base/project-base:local
    image: abstract-base/agent-base:local

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["18379:6379"]
    volumes: [supermarket-redis:/data]

  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports: ["18217:27017"]
    volumes: [supermarket-mongo:/data/db]

  sql-gateway:
    build:
      <<: *mcp-build
      dockerfile: mcp-servers/sql-gateway/Dockerfile
    env_file: .env
    restart: unless-stopped
    environment:
      - ANALYTICS_DB_DSN=${ANALYTICS_DB_DSN}
      - ANALYTICS_DB_DSN_2=${ANALYTICS_DB_DSN_2}
      - SQL_GATEWAY_HTTP_PORT=18101
    ports: ["18101:18101"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [redis, mongodb]

  conversational-router:
    build:
      <<: *agent-build
      dockerfile: agents/conversational-router/Dockerfile
    env_file: .env
    restart: unless-stopped
    environment:
      <<: *agent-env
      AGENT_HTTP_PORT: 18201
    ports: ["18201:18201"]
    depends_on: [redis, mongodb]

  sql-planner:
    profiles: ["classic-agents"]
    build:
      <<: *agent-build
      dockerfile: agents/archived/sql-planner/Dockerfile
    env_file: .env
    restart: unless-stopped
    environment:
      <<: *agent-env
      AGENT_HTTP_PORT: 18202
    ports: ["18202:18202"]
    depends_on: [redis, mongodb]

  risk-reviewer:
    profiles: ["classic-agents"]
    build:
      <<: *agent-build
      dockerfile: agents/archived/risk-reviewer/Dockerfile
    env_file: .env
    restart: unless-stopped
    environment:
      <<: *agent-env
      AGENT_HTTP_PORT: 18203
    ports: ["18203:18203"]
    depends_on: [redis, mongodb]

  data-analyst:
    profiles: ["classic-agents"]
    build:
      <<: *agent-build
      dockerfile: agents/archived/data-analyst/Dockerfile
    env_file: .env
    restart: unless-stopped
    environment:
      <<: *agent-env
      AGENT_HTTP_PORT: 18204
    ports: ["18204:18204"]
    depends_on: [redis, mongodb]
    volumes:
      - supermarket-artifacts:/app/data/artifacts
      - supermarket-attachments:/app/data/attachments

  tool-selector:
    build:
      <<: *agent-build
      dockerfile: agents/tool-selector/Dockerfile
    env_file: .env
    restart: unless-stopped
    environment:
      <<: *agent-env
      AGENT_HTTP_PORT: 18205
    ports: ["18205:18205"]
    depends_on: [redis, mongodb]
    volumes:
      - supermarket-state:/app/data/state

  data-agent:
    build:
      <<: *agent-build
      dockerfile: agents/data-agent/Dockerfile
    env_file: .env
    restart: unless-stopped
    environment:
      <<: *agent-env
      AGENT_HTTP_PORT: 18206
      SQL_GATEWAY_URL: http://sql-gateway:18101
      AGENT_TOOL_SELECTOR_URL: http://tool-selector:18205
    ports: ["18206:18206"]
    depends_on: [redis, mongodb, sql-gateway, tool-selector]
    volumes:
      - supermarket-artifacts:/app/data/artifacts
      - supermarket-attachments:/app/data/attachments
      - supermarket-state:/app/data/state

  chat-gateway:
    build:
      <<: *agent-build
      dockerfile: agents/chat-gateway/Dockerfile
    env_file: .env
    restart: unless-stopped
    environment:
      - CHAT_GATEWAY_PORT=18300
      - REDIS_URL=redis://redis:6379/0
      - MONGODB_URI=mongodb://mongodb:27017/supermarket_agent
      - SQL_GATEWAY_URL=http://sql-gateway:18101
      - AGENT_I_URL=http://conversational-router:18201
      - AGENT_DATA_URL=http://data-agent:18206
      - AGENT_TOOL_SELECTOR_URL=http://tool-selector:18205
      - DATA_AGENT_V2=1
      - ALLOW_LLM_STUB=0
      - ALLOW_DEV_AUTH=1
    ports: ["18300:18300"]
    volumes:
      - supermarket-artifacts:/app/data/artifacts
      - supermarket-attachments:/app/data/attachments
      # Pipeline (runs here) writes the SQL audit trail to data/state/audit.jsonl.
      - supermarket-state:/app/data/state
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [redis, mongodb, sql-gateway, conversational-router, tool-selector, data-agent]

  analysis-worker:
    build:
      <<: *agent-build
      dockerfile: agents/chat-gateway/Dockerfile
    command: ["uv", "run", "analysis-worker"]
    env_file: .env
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MONGODB_URI=mongodb://mongodb:27017/supermarket_agent
      - SQL_GATEWAY_URL=http://sql-gateway:18101
      - AGENT_I_URL=http://conversational-router:18201
      - AGENT_DATA_URL=http://data-agent:18206
      - AGENT_TOOL_SELECTOR_URL=http://tool-selector:18205
      - DATA_AGENT_V2=1
      - ALLOW_LLM_STUB=0
      - ALLOW_DEV_AUTH=1
    volumes:
      - supermarket-artifacts:/app/data/artifacts
      - supermarket-attachments:/app/data/attachments
      - supermarket-state:/app/data/state
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [redis, mongodb, sql-gateway, conversational-router, tool-selector, data-agent]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://chat-gateway:18300
      - NEXT_PUBLIC_APP_NAME=Agent Analysis Workspace
    ports: ["13000:3000"]
    depends_on:
      - chat-gateway

volumes:
  supermarket-redis:
  supermarket-mongo:
  supermarket-artifacts:
  supermarket-attachments:
  supermarket-state:
