data_source: db1
notes: |
  Archive lịch sử — TRAN_DATE < rolling cutoff (ngày 1 tháng trước so với as_of).
  Monthly physical names are EXPANDED AT RUNTIME:
    from shard_range.from → archive_newest_ym (tháng trước cutoff).
  Do not freeze `to` / full physical_tables lists for STRANS/PMTRANS — they go stale.
  db2 fact tables (STRANS, PMTRANS, TRANSHDR, …) are bare names — never STRANS_YYYYMM on db2.
logical_tables:
  STRANS:
    description: Chi tiết từng dòng chứng từ (SKU, SL, giá, chiết khấu, VAT, quà). Nhiều TRANS_CODE (221/113/310/…); không mặc định chỉ 113.
    physical_pattern: STRANS_{YYYYMM}
    shard_key_column: TRAN_DATE
    schema_file: tables/db1/STRANS.md
    shard_range:
      from: '202312'
      # to: computed = archive_newest_ym (month before rolling cutoff)
  PMTRANS:
    description: Thanh toán bill (221), thu/chi quỹ (008), loại khác (222). TRANS_CODE xem domain_definitions.
    physical_pattern: PMTRANS_{YYYYMM}
    shard_key_column: TRAN_DATE
    schema_file: tables/db1/PMTRANS.md
    shard_range:
      from: '202401'
  CRDTRANS_ARC:
    description: Archive giao dịch thẻ loyalty và điểm (TRANS_CODE 811/812). Join CARD_ID. Bare name — no YYYYMM.
    physical_pattern: CRDTRANS_ARC
    shard_key_column: TRAN_DATE
    schema_file: tables/db1/CRDTRANS_ARC.md
    physical_tables:
    - CRDTRANS_ARC
    shard_range: null
  TRANSHDR_ARC:
    description: Archive header chứng từ (113 bán lẻ, 221 thanh toán, …). Bare name — no YYYYMM.
    physical_pattern: TRANSHDR_ARC
    shard_key_column: TRAN_DATE
    schema_file: tables/db1/TRANSHDR_ARC.md
    physical_tables:
    - TRANSHDR_ARC
    shard_range: null
