# Production hardening overlay. Apply on top of the base compose:
#   docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d
#
# What it changes vs. base:
# - Redis requires a password (--requirepass); Mongo runs with root auth.
#   chat-gateway / data-agent get credentialed connection URLs.
# - A Caddy reverse proxy terminates TLS and is the ONLY service published to the
#   host (80/443). No app/infra container exposes a host port.
# - Readiness gating via healthchecks + depends_on conditions.
#
# Required .env values (see .env): REDIS_PASSWORD, MONGO_ROOT_USER,
# MONGO_ROOT_PASSWORD, PUBLIC_DOMAIN, TLS_EMAIL.
#
# Still your responsibility (infra-specific): public DNS record pointing at this
# host, and a secrets manager instead of a plaintext .env for real deployments.

services:
  redis:
    ports: []
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  mongodb:
    ports: []
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  sql-gateway:
    ports: []
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:18101/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  conversational-router:
    ports: []

  tool-selector:
    ports: []

  data-agent:
    ports: []
    environment:
      - AGENT_HTTP_PORT=18206
      - AGENT_TOOL_SELECTOR_URL=http://tool-selector:18205
      - MONGODB_URI=mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/supermarket_agent?authSource=admin
    depends_on:
      mongodb:
        condition: service_healthy
      tool-selector:
        condition: service_started

  chat-gateway:
    # Fronted by Caddy over the internal network; no host port.
    ports: []
    environment:
      - CHAT_GATEWAY_PORT=18300
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - MONGODB_URI=mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/supermarket_agent?authSource=admin
      - SQL_GATEWAY_URL=http://sql-gateway:18101
      - AGENT_I_URL=http://conversational-router:18201
      - AGENT_DATA_URL=http://data-agent:18206
      - AGENT_TOOL_SELECTOR_URL=http://tool-selector:18205
      - DATA_AGENT_V2=1
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      sql-gateway:
        condition: service_healthy
      conversational-router:
        condition: service_started
      tool-selector:
        condition: service_started
      data-agent:
        condition: service_started

  analysis-worker:
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - MONGODB_URI=mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/supermarket_agent?authSource=admin
      - SQL_GATEWAY_URL=http://sql-gateway:18101
      - AGENT_I_URL=http://conversational-router:18201
      - AGENT_DATA_URL=http://data-agent:18206
      - AGENT_TOOL_SELECTOR_URL=http://tool-selector:18205
      - DATA_AGENT_V2=1
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      sql-gateway:
        condition: service_healthy
      conversational-router:
        condition: service_started
      tool-selector:
        condition: service_started
      data-agent:
        condition: service_started

  frontend:
    ports: []
    environment:
      - BACKEND_URL=http://chat-gateway:18300
      - NEXT_PUBLIC_APP_NAME=Agent Analysis Workspace
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      chat-gateway:
        condition: service_started

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN}
      - TLS_EMAIL=${TLS_EMAIL}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  caddy-data:
  caddy-config:
